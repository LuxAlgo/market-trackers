name: Release

# Manual npm publish of the workspace packages (@luxalgo/market-trackers-core,
# -mcp, -cli). Runs the full gate (build, lint, test) first, then publishes
# via npm trusted publishing: the job's GitHub OIDC identity is exchanged for
# a short-lived npm credential at publish time, and npm attaches provenance
# attestations automatically. No npm tokens exist anywhere in this repo — no
# NPM_TOKEN secret, no .npmrc auth lines — per the @luxalgo publishing policy.
#
# Human setup (once per package, on npmjs.com): package → Settings →
# Trusted publisher → GitHub Actions → owner "LuxAlgo", repository
# "market-trackers", workflow "release.yml". Until that is configured for a
# package, its publish fails with an auth error and nothing partial happens.
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag to publish under"
        required: false
        default: "latest"

# id-token is what lets the job mint the OIDC identity that npm's trusted
# publishing exchanges for publish access (and what signs the provenance).
permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Publish (trusted publishing)
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: pnpm publish -r --access public --no-git-checks --provenance --tag "${DIST_TAG:-latest}"
