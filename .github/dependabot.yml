# Weekly dependency PRs. Minor + patch updates arrive grouped (one PR per
# ecosystem) to keep the noise down; majors still arrive individually so
# breaking changes get their own review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
