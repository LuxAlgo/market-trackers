[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-trackers-data"
version = "0.1.0"
description = "A small, dependency-light reader for LuxAlgo Market Trackers's published JSON dumps — the public record of US markets (congress trades, insider filings, 13F holdings, government contracts, lobbying, short-sale volume, and more), free CC0 data with per-row primary-source provenance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LuxAlgo" }]
keywords = [
  "market-trackers",
  "sec",
  "edgar",
  "congress-trades",
  "insider-trading",
  "13f",
  "open-data",
  "pandas",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/LuxAlgo/market-trackers"
Repository = "https://github.com/LuxAlgo/market-trackers"
Data = "https://github.com/LuxAlgo/market-trackers-data"

[tool.setuptools.packages.find]
where = ["."]
include = ["market_trackers_data*"]
